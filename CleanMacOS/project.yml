name: CleanMacOS
options:
  bundleIdPrefix: click.ngoctruong
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  MacKitAudioBridge:
    type: library.static
    platform: macOS
    sources:
      - path: AudioBridge
    settings:
      DEFINES_MODULE: YES
      PRODUCT_MODULE_NAME: MacKitAudioBridge
      CLANG_ENABLE_MODULES: YES
      HEADER_SEARCH_PATHS: $(SRCROOT)/AudioBridge/include
      MODULEMAP_FILE: $(SRCROOT)/AudioBridge/include/module.modulemap
  CleanMacOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - target: MacKitAudioBridge
      - package: Sparkle
      - package: KeyboardShortcuts
    preBuildScripts:
      - name: Build Rust core
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.cargo/bin:$PATH"
          cargo build --release --manifest-path "$SRCROOT/Rust/Cargo.toml"
    info:
      path: Info.plist
      properties:
        CFBundleName: MacKit
        CFBundleDisplayName: MacKit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: MacKit records your voice into screen recordings when the microphone is turned on.
        NSAudioCaptureUsageDescription: MacKit changes the volume of the apps you adjust in the volume mixer. Their sound is never recorded or saved.
        NSBluetoothAlwaysUsageDescription: MacKit shows Bluetooth connection alerts only when you enable them in Island.
        NSCalendarsFullAccessUsageDescription: MacKit shows your upcoming events in Island only when you enable Calendar and allow access.
        NSCameraUsageDescription: MacKit shows your camera in a small mirror window when you open Camera Preview. Nothing is recorded or saved.
        NSAppleEventsUsageDescription: MacKit asks Finder for the files you selected and the folder you are in, and changes system settings you turn on.
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: https://truong62.github.io/clean-macos/appcast.xml
        SUPublicEDKey: aSo25KstkpaOi/z97B2XUDWXSv/R7TxPpHbLJ0RpOa8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: click.ngoctruong.CleanMacOS
      MARKETING_VERSION: "1.0.50"
      CURRENT_PROJECT_VERSION: "51"
      SWIFT_VERSION: "5.9"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      SWIFT_INCLUDE_PATHS: $(SRCROOT)/Rust/include
      LIBRARY_SEARCH_PATHS: $(SRCROOT)/Rust/target/release
