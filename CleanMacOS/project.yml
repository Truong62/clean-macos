name: CleanMacOS
options:
  bundleIdPrefix: click.ngoctruong
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  CleanMacOS:
    type: application
    platform: macOS
    sources:
      - Sources
    dependencies:
      - package: Sparkle
    info:
      path: Info.plist
      properties:
        CFBundleName: Clean macOS
        CFBundleDisplayName: Clean macOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        NSPrincipalClass: NSApplication
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.utilities
        SUFeedURL: https://truong62.github.io/clean-macos/appcast.xml
        SUPublicEDKey: aSo25KstkpaOi/z97B2XUDWXSv/R7TxPpHbLJ0RpOa8=
        SUEnableAutomaticChecks: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: click.ngoctruong.CleanMacOS
      MARKETING_VERSION: "1.0.1"
      CURRENT_PROJECT_VERSION: "2"
      SWIFT_VERSION: "5.9"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
