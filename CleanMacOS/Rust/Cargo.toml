[package]
name = "mackit-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mackit_core"
crate-type = ["staticlib", "rlib"]

[dependencies]
memchr = "2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
